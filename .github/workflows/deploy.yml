
name: Deploy to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Source NVM to get Node.js in PATH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /home/janisahil-movie/htdocs/movie.janisahil.com
            
            # Pull latest changes from GitHub
            git pull origin main
            
            # Create .env file from GitHub secrets
            cat > .env << 'EOF'
            PORT=${{ secrets.PORT }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            EOF
            
            # Install dependencies
            npm install
            
            # Build frontend
            npm run build
            
            # Install/Update PM2 globally if not present
            npm install pm2@latest -g
            
            # Start or Reload the application using the ecosystem file with production env
            pm2 startOrReload ecosystem.config.js --env production
            
            # Save PM2 state for reboots
            pm2 save
            
            # Ensure the PATH is set in crontab (CloudPanel specific requirement)
            # This only needs to run once, but safe to keep
            (crontab -l 2>/dev/null | grep -q "pm2 resurrect") || (echo "PATH=\$PATH" && echo "@reboot pm2 resurrect &> /dev/null") | crontab -

